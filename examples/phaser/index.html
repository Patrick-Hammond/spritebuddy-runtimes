<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpriteBuddy: Phaser example</title>
    <link rel="stylesheet" href="../example.css" />
    <!--
      Where the browser finds each package: this repo's builds (run `npm run build` first) and
      the Phaser 4 the tests use. In your own page, point them at a CDN instead:
        "phaser": "https://cdn.jsdelivr.net/npm/phaser@4/dist/phaser.esm.js",
        "@spritebuddy/phaser": "https://cdn.jsdelivr.net/npm/@spritebuddy/phaser@0.3.0/dist/index.js",
        "@spritebuddy/core": "https://cdn.jsdelivr.net/npm/@spritebuddy/core@0.3.0/dist/index.js"
      or `npm install phaser @spritebuddy/phaser` and let your bundler resolve them.
    -->
    <script type="importmap">
      {
        "imports": {
          "phaser": "../../node_modules/phaser4/dist/phaser.esm.js",
          "@spritebuddy/phaser": "../../packages/phaser/dist/index.js",
          "@spritebuddy/core": "../../packages/core/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>@spritebuddy/phaser with Phaser 4</h1>
    <p>Three slimes from one sheet. Click one to make it jump.</p>
    <div id="stage"></div>
    <p id="status" class="status" aria-live="polite"></p>
    <script type="module" src="./main.js"></script>

    <h2>Real-time lighting</h2>
    <p>
      A candle's point light lights the slime through its normal map: brighter as it gets closer,
      and from whichever side the flame is on. Move it with the cursor keys; Space jumps.
    </p>
    <div id="lit-stage"></div>
    <p id="lit-status" class="status" aria-live="polite"></p>
    <script type="module" src="./lighting.js"></script>
  </body>
</html>
