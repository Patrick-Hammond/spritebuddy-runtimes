name: CI

# Started by hand only (Actions tab > CI > Run workflow), to save Actions minutes.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build

  godot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: ['4.3-stable', '4.5.1-stable']
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot ${{ matrix.godot }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v*_linux.x86_64 godot-bin
      - name: Import the test project
        run: ./godot-bin --headless --path godot --import || true
      - name: Run the addon tests
        run: ./godot-bin --headless --path godot -s tests/run_tests.gd

  defold:
    runs-on: ubuntu-latest
    env:
      DEFOLD: '1.14.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download Defold ${{ env.DEFOLD }}
        run: |
          curl -sSL -o bob.jar "https://github.com/defold/defold/releases/download/$DEFOLD/bob.jar"
          unzip -q -j bob.jar 'libexec/x86_64-linux/*' -d engine
          chmod +x engine/*
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libglu1-mesa
      - name: Build the examples and the tests
        working-directory: defold
        run: |
          java -jar ../bob.jar --platform x86_64-linux --variant debug build
          java -jar ../bob.jar --platform x86_64-linux --variant debug --settings tests/tests.settings --output build/tests build
      - name: Run the library tests in the engine
        working-directory: defold
        run: LD_LIBRARY_PATH=../engine xvfb-run -a ../engine/dmengine build/tests/game.projectc

  unity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test the C# core against the fixtures
        run: dotnet run --project unity/tests/Core
      - name: Compile the package and examples against Unity's API
        run: dotnet build unity/tests/Compile
