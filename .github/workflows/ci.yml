name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build

  godot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: ['4.3-stable', '4.5.1-stable']
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot ${{ matrix.godot }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v*_linux.x86_64 godot-bin
      - name: Import the test project
        run: ./godot-bin --headless --path godot --import || true
      - name: Run the addon tests
        run: ./godot-bin --headless --path godot -s tests/run_tests.gd
